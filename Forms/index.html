<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap CSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Form Demo</h2>
        <form >
            <div class="row">
             <div class="mb-3 col-md-6">
             <label class="form-label" for="Email"> Email</label>
             <input type="text" placeholder="Email" class="form-control" id="Email">
            </div>

            <div class="mb-3 col-md-6">
             <label class="form-label" for="pass"> Password</label>
             <input type="password" placeholder="password" class="form-control" id="pass">

            </div>

            </div>
            
            
            

            <div class="mb-3">
                <select class="form-select">
                    <option selected>Select a number</option>
                    <option value="1">one</option>
                    <option value="2">two</option>
                    <option value="3">three</option>
                    <option value="4">four</option>
                </select>
            </div>

            <div class="normal mb-3">
                <input type="checkbox" id="agree">
                <label for="agree">Agree</label>
            </div>


            <div class="form-check mb-3">
                <input type="checkbox" id="agreebs" class="form-check-input" >
                <label for="agreebs" class="form-check-label" >Agree</label>
            </div>
<br>
<br>


            <div class="form-check mb-3">
                <input type="radio" id="radiobs" class="form-check-input" >
                <label for="radiobs" class="form-check-label" >Agree</label>
            </div>


            <br>
            <br>

            <div class="form-check form-switch mb-3">
                <input type="checkbox" id="agreebs" class="form-check-input" >
                <label for="agreebs" class="form-check-label" >Agree</label>
            </div>

            

        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
